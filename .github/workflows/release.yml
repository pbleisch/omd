name: Release

# Package (and optionally publish) the extension when a version tag is pushed, e.g. `v0.1.0`.
on:
  push:
    tags: ['v*']

permissions:
  contents: write # to attach the .vsix to the GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Package .vsix
        run: npx vsce package --out omd.vsix
      - name: Attach .vsix to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: omd.vsix
      # Publishes to the VS Code Marketplace only when a VSCE_PAT secret is configured.
      - name: Publish to Marketplace
        if: ${{ env.VSCE_PAT != '' }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --pat "$VSCE_PAT"
